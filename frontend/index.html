<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Monitor del Sistema</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card p-3 mb-3">
                    <h3>CPU</h3>
                    <p id="cpu">Cargando...</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 mb-3">
                    <h3>Memoria</h3>
                    <p id="ram">Cargando...</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 mb-3">
                    <h3>Disco</h3>
                    <p id="disco">Cargando...</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 mb-3">
                    <h3>Red</h3>
                    <p id="red">Cargando...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>    
</body>
</html>
